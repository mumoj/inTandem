<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640" role="img" aria-labelledby="t">
<title id="t">inTandem architecture. The planner, the CLI and the dashboard all call the bridge. The bridge calls the supervisor, which prompts opencode serve. OpenCode calls the model provider and edits your working tree, and streams events back to the event pump. The monitor and host watch run alongside, state goes to disk, and alerts go to a command or ntfy.</title>
<defs>
<marker id="g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l6 3-6 3" fill="none" stroke="#5fbfa2" stroke-width="1.4"/></marker>
