<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="t">
  <title id="t">A planner such as Claude Code or Codex sends a specification to inTandem. inTandem supervises an implementer running on OpenCode (1.x or 2.x) or Claude Code, which edits your Git worktree and streams events back. You can respond to alerts and approve or deny requests from the dashboard or CLI.</title>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#2a353c" fill-opacity="0.45"/>
    </pattern>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5fbfa2" stop-opacity="0.18"/>
      <stop offset="65%" stop-color="#5fbfa2" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#5fbfa2" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrowTeal" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1.2 6.8 4 1 6.8" fill="none" stroke="#5fbfa2" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1.2 6.8 4 1 6.8" fill="none" stroke="#e5b567" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .t { font-size: 17.5px; font-weight: 700; fill: #eef2f4; }
    .tm { font-size: 15.5px; font-weight: 700; fill: #eef2f4; }
    .ts { font-size: 13px; font-weight: 600; fill: #eef2f4; }
    .s { font-size: 12.5px; fill: #94a3ad; }
    .xs { font-size: 10.5px; fill: #94a3ad; }
    .h { font-size: 13px; fill: #94a3ad; }
    .kicker { font-size: 11px; font-weight: 600; letter-spacing: 0.9px; fill: #94a3ad; }
    .lt { font-size: 11.5px; font-weight: 500; fill: #5fbfa2; }
    .la { font-size: 11.5px; font-weight: 500; fill: #e5b567; }
    .pill { font-size: 12px; font-weight: 500; fill: #eef2f4; }
    .wire { fill: none; stroke: #5fbfa2; stroke-width: 1.5; stroke-opacity: 0.65; }
    .wireA { fill: none; stroke: #e5b567; stroke-width: 1.5; stroke-opacity: 0.7; }
  </style>

  <!-- Canvas -->
  <rect width="960" height="440" rx="18" fill="#0d1216"/>
  <rect width="960" height="440" rx="18" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="959" height="439" rx="18" fill="none" stroke="#2a353c"/>

  <!-- Subtle glow behind focal hub card -->
  <circle cx="377" cy="156" r="168" fill="url(#hubGlow)"/>

  <!-- Header -->
  <text x="32" y="42" class="h">One model plans and reviews. Another implements. inTandem supervises the work.</text>
  <g transform="translate(676 26)">
    <rect width="252" height="24" rx="12" fill="#10171b" stroke="#2a353c"/>
    <circle cx="15" cy="12" r="3.2" fill="#5fbfa2"/>
    <text x="27" y="15.8" class="xs">MCP server · OpenCode &amp; Claude Code</text>
  </g>

  <!-- Wires & animated pulses -->
  <!-- Planner -> inTandem (spec) -->
  <path d="M210 130 H271" class="wire" marker-end="url(#arrowTeal)"/>
  <circle r="3.2" fill="#5fbfa2" opacity="0">
    <animateMotion dur="3.2s" begin="0s" repeatCount="indefinite" path="M210 130 H271"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.88;1" dur="3.2s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <text x="242" y="120" text-anchor="middle" class="lt">spec</text>

  <!-- inTandem -> Planner (result) -->
  <path d="M274 182 H213" class="wireA" marker-end="url(#arrowAmber)"/>
  <circle r="3.2" fill="#e5b567" opacity="0">
    <animateMotion dur="3.2s" begin="1.6s" repeatCount="indefinite" path="M274 182 H213"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.88;1" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="242" y="201" text-anchor="middle" class="la">result</text>

  <!-- inTandem -> Implementer (prompt) -->
  <path d="M480 134 H541" class="wire" marker-end="url(#arrowTeal)"/>
  <circle r="3.2" fill="#5fbfa2" opacity="0">
    <animateMotion dur="3.2s" begin="0.5s" repeatCount="indefinite" path="M480 134 H541"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.88;1" dur="3.2s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <text x="512" y="124" text-anchor="middle" class="lt">prompt</text>

  <!-- Implementer -> inTandem (events) -->
  <path d="M544 178 H483" class="wireA" marker-end="url(#arrowAmber)"/>
  <circle r="3.2" fill="#e5b567" opacity="0">
    <animateMotion dur="3.2s" begin="2.1s" repeatCount="indefinite" path="M544 178 H483"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.88;1" dur="3.2s" begin="2.1s" repeatCount="indefinite"/>
  </circle>
  <text x="512" y="197" text-anchor="middle" class="la">events</text>

  <!-- Implementer -> Repo (edits) -->
  <path d="M744 156 H797" class="wire" marker-end="url(#arrowTeal)"/>
  <circle r="3.2" fill="#5fbfa2" opacity="0">
    <animateMotion dur="3.2s" begin="1.0s" repeatCount="indefinite" path="M744 156 H797"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.88;1" dur="3.2s" begin="1.0s" repeatCount="indefinite"/>
  </circle>
  <text x="772" y="145" text-anchor="middle" class="lt">edits</text>

  <!-- inTandem <-> You (alerts / allow-deny) -->
  <path d="M360 242 V299" class="wireA" marker-end="url(#arrowAmber)"/>
  <circle r="3.2" fill="#e5b567" opacity="0">
    <animateMotion dur="3.2s" begin="0.4s" repeatCount="indefinite" path="M360 242 V299"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.88;1" dur="3.2s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <text x="348" y="276" text-anchor="end" class="la">alerts</text>

  <path d="M394 302 V245" class="wire" marker-end="url(#arrowTeal)"/>
  <circle r="3.2" fill="#5fbfa2" opacity="0">
    <animateMotion dur="3.2s" begin="2.0s" repeatCount="indefinite" path="M394 302 V245"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.88;1" dur="3.2s" begin="2.0s" repeatCount="indefinite"/>
  </circle>
  <text x="406" y="276" text-anchor="start" class="lt">allow / deny</text>

