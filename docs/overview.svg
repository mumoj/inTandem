<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="t">
<title id="t">A planner such as Claude Code or Codex sends a spec to inTandem. inTandem prompts the implementer model in OpenCode, which edits your repo, then returns its result to the planner for verification. You can allow or deny requests from the dashboard or a phone.</title>
