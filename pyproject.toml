[project]
name = "inTandem"
version = "0.1.2.1"
description = "A harness for pairing coding agents: one model plans, another implements, and the planner reviews the result"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
authors = [{ name = "Jack Mumo" }]
keywords = ["ai-agents", "claude-code", "codex", "mcp", "opencode"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.116.2,<1",
    "httpx>=0.28,<1",
    "httpx-sse>=0.4,<1",
    "mcp>=2,<3",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.6,<3",
    "starlette>=0.48,<2",
    "typer>=0.15,<1",
    "uvicorn>=0.32,<1",
]

[project.scripts]
inTandem = "intandem.cli:app"

[project.urls]
Homepage = "https://github.com/mumoj/inTandem"
Documentation = "https://github.com/mumoj/inTandem/blob/main/docs/usage.md"
Issues = "https://github.com/mumoj/inTandem/issues"

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intandem"]

# Only what a source build needs: stray files in the checkout must never ship.
[tool.hatch.build.targets.sdist]
only-include = ["src", "LICENSE", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # import order
    "UP",            # modern syntax
    "B",             # likely bugs
    "SIM",           # simpler forms
    "C4",            # comprehensions
    "RUF",           # ruff's own checks
    "ASYNC",         # blocking calls inside async code
    "PTH",           # pathlib over os.path
    "PT",            # pytest style
    "N",             # naming
]

[tool.ruff.lint.per-file-ignores]
# Typer reads option metadata from default values, which is exactly what B008 flags.
"src/intandem/cli/*.py" = ["B008"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
# Tests poke at private state on purpose and lean on fixtures pyright cannot see through.
executionEnvironments = [
    { root = "tests", extraPaths = [".", "src"], reportPrivateUsage = false, reportUnknownMemberType = false, reportUnknownArgumentType = false, reportUnknownVariableType = false, reportMissingParameterType = false, reportUnknownParameterType = false, reportUnknownLambdaType = false },
    { root = "src" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "e2e: drives a real `opencode serve` with a scripted model (needs OpenCode 1.x)",
]
addopts = "-ra"
